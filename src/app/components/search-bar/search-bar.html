<div class="container-fluid header">
    <div class="input-group input-group_lg">
        <span class="input-group-text">Brand</span>
            <input (input)="selectAutoList(brand.value)" #brand type="text" class="form-control" 
          placeholder="e.g. Audi">
        <button (click)="selectAutoList(brand.value)" class="btn btn-primary">Serach</button>
       

    </div>

</div>
<div class="container auto-container">
    @for (auto of selectedAutos ; track auto.id ; let indice=$index;) {
        <div class="card" style="width: 18rem; padding: 15px;">
          <img [src]="auto.photo" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title" >{{auto.brand}} - {{auto.model}}</h5>
            <p class="card-text">Power : {{auto.power}}</p>
            <p class="card-text">Price : {{auto.price|currency:'EUR'}}</p>
            <p class="card-text">Only : {{auto.availability}} units available</p>
            <a href="#" class="btn btn-primary" (click)="showDetails(auto)">More details</a>
          </div>
        </div> 
    }

@empty{
  <p>No cars found!</p>
}
</div>
